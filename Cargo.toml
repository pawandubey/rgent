[package]
name = "rgent"
version = "0.1.0"
edition = "2021"
authors = ["Pawan Dubey <git@pawandubey.com>"]
description = "A speedy static site generator."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.68"
assert_cmd = "2.0.7"
assert_fs = "1.0.10"
bytes = "1.12.1"
clap = { version = "4.0.32", features = ["derive"] }
exitcode = "1.1.2"
handlebars = "6.4.4"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
indoc = "1.0.8"
itertools = "0.13.0"
pathdiff = "0.2.1"
predicates = "2.1.4"
pulldown-cmark = "0.9.2"
serde = { version = "1.0.151", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs", "macros", "io-util", "time"] }
toml = "0.5.10"
walkdir = "2.3.2"

[dev-dependencies]
serde_json = "1.0.154"
