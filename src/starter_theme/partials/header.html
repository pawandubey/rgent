<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{#if post}}{{post.title}} | {{/if}}{{config.site.name}}</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/highlight.css">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="/">{{config.site.name}}</a>
    {{#if config.site.tagline}}<p class="site-tagline">{{config.site.tagline}}</p>{{/if}}
    {{#if nav_pages}}
    <nav class="site-nav">
      <ul>
        <li><a href="/">Home</a></li>
        {{#each nav_pages}}<li><a href="{{url}}">{{title}}</a></li>{{/each}}
      </ul>
    </nav>
    {{/if}}
  </header>
