{{> header}}
  <main>
    <article class="post">
      <h1 class="post-title">{{post.title}}</h1>
      <p class="post-meta"><time datetime="{{post.date_iso}}">{{post.date}}</time> &middot; {{post.author}}</p>
      <div class="post-content">
        {{{post.content}}}
      </div>
      {{#if post.tags}}
      <ul class="post-tags">
        {{#if config.rendertags}}
        {{#each post.tag_links}}<li><a href="{{url}}">{{name}}</a></li>{{/each}}
        {{else}}
        {{#each post.tags}}<li>{{this}}</li>{{/each}}
        {{/if}}
      </ul>
      {{/if}}
    </article>
  </main>
{{> footer}}
